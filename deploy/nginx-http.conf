server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name pdf.wsgnay.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
